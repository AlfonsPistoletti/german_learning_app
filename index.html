<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deutsch A1</title>
  <meta name="theme-color" content="#faf3f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Deutsch A1">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-page text-ink text-[17px] leading-snug">
  <main class="max-w-160 mx-auto px-4 pt-[calc(env(safe-area-inset-top)+16px)] pb-[calc(env(safe-area-inset-bottom)+96px)]">
    <section id="cards" class="view"></section>
    <section id="exercises" class="view" hidden></section>
    <section id="progress" class="view" hidden></section>
  </main>
  <nav class="fixed inset-x-0 bottom-0 flex bg-surface/85 backdrop-blur border-t border-line pb-[env(safe-area-inset-bottom)]">
    <button data-view="cards" aria-current="page" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-xs text-muted aria-[current=page]:text-accent cursor-pointer"><i data-lucide="layers" aria-hidden="true"></i><span>Cards</span></button>
    <button data-view="exercises" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-xs text-muted aria-[current=page]:text-accent cursor-pointer"><i data-lucide="pencil-line" aria-hidden="true"></i><span>Exercises</span></button>
    <button data-view="progress" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-xs text-muted aria-[current=page]:text-accent cursor-pointer"><i data-lucide="chart-line" aria-hidden="true"></i><span>Progress</span></button>
  </nav>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
